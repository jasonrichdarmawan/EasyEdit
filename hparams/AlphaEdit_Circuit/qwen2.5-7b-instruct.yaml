alg_name: "AlphaEdit_Circuit"
model_name: "Qwen/Qwen2.5-7B-Instruct"
num_hidden_layers: 28
edit_with_chat_template: False
stats_dir: "./data/stats"
# device: 0
# layers: [4, 5, 6, 7, 8]
# layers: [7,11,13,14,17]
# layers: [6, 7, 8, 10, 11]
clamp_norm_factor: 4
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 1e-1
v_loss_layer: 27
v_weight_decay: 0.5
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_batch_tokens: 4096
mom2_n_samples: 100000
mom2_dtype: "float32"
nullspace_threshold: 2e-2
L2: 10

# Destination node
hook_q_input: "model.layers.{}.self_attn.q_proj"
hook_k_input: "model.layers.{}.self_attn.k_proj"
hook_v_input: "model.layers.{}.self_attn.v_proj"
hook_mlp_in: "model.layers.{}.mlp"
hook_resid_post: "model.layers.{}"

use_subject_noise_baseline: True
no_target_recompute: False